name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff -r workflows/requirements.txt
      - run: ruff check workflows .github/scripts
      - name: Import-check every workflow (no API calls)
        working-directory: workflows
        run: |
          for f in 0*.py; do python -c "import importlib.util as u, sys; s=u.spec_from_file_location('m', '$f'); m=u.module_from_spec(s); s.loader.exec_module(m)"; done
        env:
          ANTHROPIC_API_KEY: dummy-key-for-import-check
